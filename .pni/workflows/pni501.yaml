id: pni501
category: audit
name: Slim Framework 4.15.3 Engineering & Architecture Diagnostic (PNI501)
description: Deterministic PHP AST, namespace dependency DAG, PSR-7/PSR-15/PSR-11 library hygiene, hermetic PHPUnit + PCOV container runtime, and supply-chain diagnostic of Slim Framework 4.15.3, compiled into HTML and A4 PDF under docs/pni501/.

targets:
  root: "."
  source:
    - "Slim"
  tests:
    - "tests"
  docs:
    - "README.md"
  exclude:
    - "reports/**"
    - "pni501_src/**"
    - "docs/**"
    - "user_guide_src/**"
    - "api_src/**"
    - "architecture_src/**"

steps:
  - id: repo_and_deps
    uses: repo_structure_audit

  - id: ast_and_quality
    uses: php_ast_audit

  - id: arch_recording
    uses: architecture_analysis

  - id: library_hygiene
    uses: library_hygiene_audit

  - id: test_health
    uses: php_test_audit

  - id: runtime_verification
    uses: container_runtime_audit
    with:
      test_timeout_sec: 300
      test_cmd: "for p in $(find Slim -name '*.php'); do php -l \"$p\" >/dev/null || exit 1; done && phpunit -d pcov.enabled=1 -d pcov.directory=. --log-junit /out/junit.xml --coverage-clover /out/clover.xml"

  - id: security_audit
    uses: security_vulnerability_audit

  - id: output_score
    uses: emit_score
    with:
      target: "pni501"
      save_file: false

  - id: create_report
    uses: write_drawlib_report
    with:
      target: "pni501"
      src_dir: "."
      output_dir: "docs/pni501"
      formats:
        - "pdf"
        - "html"
      lang: "en"
      style: "google"
